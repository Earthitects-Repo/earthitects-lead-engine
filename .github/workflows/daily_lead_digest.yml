name: Earthitects Daily Liquidity Lead Digest

on:
  schedule:
    # 2:30 AM UTC = 8:00 AM Indian Standard Time (IST) every day
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scrape-and-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Prospecting Engine & Email Digest
        env:
          RECIPIENT_EMAIL: faraz.z@earthitects.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          python run_engine.py --send
